name: CI

on:
  push:
  pull_request:

jobs:
  package-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install ".[cuda12,examples,test,dev]"
      - name: Run CPU-safe tests
        run: python -m pytest -m "not gpu"
      - name: Build distributions
        run: python -m build
