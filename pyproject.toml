[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gqis"
version = "0.1.0"
description = "GPU Quantum Interferometry Solver for massive parameter sweeps of user-defined finite-dimensional Lindblad systems."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Oleh Ivakhnenko" }
]
keywords = [
    "GQIS",
    "CUDA",
    "CuPy",
    "SymPy",
    "Lindblad",
    "quantum interferometry",
    "open quantum systems",
    "parameter sweep",
    "GPU computing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "sympy>=1.11",
]

[project.urls]
Documentation = "https://github.com/Olegiv95/Gpu-Quantum-Interferometry-Solver#readme"
Changelog = "https://github.com/Olegiv95/Gpu-Quantum-Interferometry-Solver/blob/main/CHANGELOG.md"
Repository = "https://github.com/Olegiv95/Gpu-Quantum-Interferometry-Solver"
Issues = "https://github.com/Olegiv95/Gpu-Quantum-Interferometry-Solver/issues"

[project.scripts]
gqis-check = "gqis.check_environment:main"
gpu-int-tool-check = "gqis.check_environment:main"

[project.optional-dependencies]
cuda11 = ["cupy-cuda11x>=13,<14"]
cuda12 = ["cupy-cuda12x>=13"]
cuda13 = ["cupy-cuda13x>=14"]
examples = ["matplotlib>=3.7"]
benchmarks = ["matplotlib>=3.7", "qutip>=5.0", "scipy>=1.10"]
test = ["pytest>=8"]
dev = ["build>=1", "pytest>=8", "ruff==0.16.2"]
all-cuda12 = [
    "cupy-cuda12x>=13",
    "matplotlib>=3.7",
    "qutip>=5.0",
    "scipy>=1.10",
    "build>=1",
    "pytest>=8",
    "ruff==0.16.2",
]

[tool.setuptools]
packages = ["gqis", "gpu_int_tool"]
py-modules = ["GPU_Int_Tool"]
include-package-data = true

[tool.setuptools.package-data]
gqis = ["N_Level_Kernel.cu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires a working CUDA GPU"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F821", "F822", "F823"]
ignore = ["E741"]  # Conventional scientific symbols such as I are allowed.
